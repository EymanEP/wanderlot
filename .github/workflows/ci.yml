name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End to end (Node and Worker)
    runs-on: ubuntu-latest
    env:
      # wrangler dev runs fully local here: no Cloudflare account involved.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Panel -> site -> a friend's passkey, then the site alone on Node.
      - run: npm run test:e2e
      # The same site checks against the Cloudflare Worker with a local D1.
      - run: npm run test:e2e:worker -w @wanderlot/site
