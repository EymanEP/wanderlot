name: Idea or feature
description: Something that would make planning trips with your friends better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation with your group, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
